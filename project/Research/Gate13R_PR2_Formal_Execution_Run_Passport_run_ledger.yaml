  user_words: "授权将 Gate 13R-PR2 raw-data / analysis 两阶段提交规则正式绑定到此前已经授权的 Gate 13R-PR2\
    \ S48/H48 正式 campaign，并继续完成剩余预启动验证；全部启动前硬门禁通过后，按原授权执行一次正式 raw-data acquisition\
    \ attempt。\n\n本授权是对既有 Gate 13R-PR2 正式执行授权的补充，不替换、不扩大也不削弱既有授权。仍不授权 Gate 14R，也不授权第二阶段正式统计分析。\n\
    \n一、活动上游与两阶段提交绑定\n\n1. 继续以此前授权的以下 active Gate 13R-PR2 formal-preparation artifacts\
    \ 为唯一正式执行上游：\n\n   - `Research/Gate13R_PR2_NonExecuting_Readiness_Checkpoint.v1.json`\n\
    \     SHA-256：\n     `669a5291ab2e219461ca9797696ba29bce32e198c11a983f0f1f31f3f7799fbc`\n\
    \n   - `Research/Gate13R_PR2_Formal_Campaign_Config.v2.json`\n     SHA-256：\n\
    \     `87d7012af4e8e5b5e16cb64b50f41f1dcb5b1eebf5d7eba1425b29e0fa13dd5e`\n\n \
    \  - `Research/Gate13R_PR2_Formal_Williams_Matched_Schedule.v2.jsonl`\n     SHA-256：\n\
    \     `df8802c34ef033dd2eb906f6a70e8c8fc594bdc0a386a48afe6c756789075dae`\n\n \
    \  - `Research/Gate13R_PR2_Formal_Williams_Matched_Schedule_Manifest.v2.json`\n\
    \     SHA-256：\n     `b5763f1540c0193199201cd6bf025c43443d5bd2e67cb8808e0a2b86ef91b724`\n\
    \n   - `Research/Gate13R_PR2_Storage_WallClock_Preflight.v2.json`\n     SHA-256：\n\
    \     `c474499e647d5ad32efe01d199ede187b61f004e9487b8278e44109258cd0435`\n\n \
    \  - `Research/Gate13R_PR2_Formal_Preparation_Provenance.v2.json`\n     SHA-256：\n\
    \     `9e81530bcf6d32dd1792c8bd693d72988bef6f37e59a1ad154019ca228908e56`\n\n \
    \  - `Research/Gate13R_PR2_Formal_Preparation_Schema.v2.json`\n     SHA-256：\n\
    \     `940bfca8cb3e677deadff2600471eeaec9e99ff6bab9a06a625a0f30365a9d1e`\n\n2.\
    \ 将以下已经在正式数据产生前建立的两阶段提交文件作为本次 formal execution 的强制补充合同：\n\n   - `Research/Gate13R_PR2_RawAnalysis_TwoPhaseCommit_Amendment.v1.json`\n\
    \     SHA-256：\n     `805200a362440918682317f3ecf4fdb35fa441a1459457700a0f5f2a43a113df`\n\
    \n   - `Research/Gate13R_PR2_RawAnalysis_TwoPhaseCommit_Specification.v1.md`\n\
    \     SHA-256：\n     `1641c22ddcb788f46ee1b2956f3bf8c8e13312459b5c22b139396001823085a5`\n\
    \n3. 后续 formal execution receipt、adapter provenance、prelaunch checkpoint、raw execution\
    \ manifest 和 raw-data freeze receipt 必须显式绑定上述 amendment/specification 的：\n\n \
    \  - 相对路径；\n   - 解析后绝对路径；\n   - amendment/specification ID；\n   - SHA-256；\n \
    \  - 本次 formal authorization identity；\n   - active config、schedule、schedule manifest\
    \ 和 readiness checkpoint identity。\n\n4. 两阶段提交 amendment 是 additive execution-integrity\
    \ amendment。它不得改变：\n\n   - S48/H48；\n   - 74-campaign 矩阵；\n   - 3,552 个 fresh\
    \ Unity block processes；\n   - 10,176 个 algorithm samples；\n   - shared-goal Williams\
    \ 顺序；\n   - heterogeneous matched-superblock 顺序；\n   - AB/BA 24/24；\n   - 严格串行；\n\
    \   - 一个 Unity Editor process 最多执行一个完整 block；\n   - 每算法在一个 block 中最多执行一次；\n  \
    \ - 每样本完整 reset；\n   - telemetry；\n   - managed-memory 规则；\n   - correctness/oracle/structural\
    \ exact-match；\n   - P1–P5 与 C1–C5 统计语义；\n   - Holm FWER 规则；\n   - frozen exclusion、failure\
    \ 和 timeout denominator 规则。\n\n二、第一阶段：正式原始数据采集提交\n\n5. 第一阶段只授权 formal raw-data\
    \ acquisition，不授权正式统计分析。\n\n6. 全部启动前硬门禁通过后，才允许创建精确正式输出根：\n\n   `H:\\DDM_Final_Project\\\
    Research\\FormalRuns\\Gate13R_RQAligned_S48H48\\v1`\n\n   并创建唯一、版本化、不可变的 formal\
    \ execution receipt。\n\n7. formal execution receipt 必须明确记录：\n\n   - `RAW-ACQUISITION-AUTHORIZED`\n\
    \   - `FORMAL-ANALYSIS-NOT-AUTHORIZED`\n   - `GATE14R-NOT-AUTHORIZED`\n   - `NO-AUTOMATIC-UNITY-RETRY`\n\
    \   - `NO-AUTOMATIC-UNITY-RESUME`\n   - `NO-TOP-UP`\n   - `NO-PARTIAL-ATTEMPT-MERGE`\n\
    \   - `TWO-PHASE-COMMIT-REQUIRED`\n\n8. 正式采集按冻结 schedule 的 global process ordinal\
    \ 严格串行执行：\n\n   - 32 个 shared-goal campaigns；\n   - 每个 shared campaign 48 个完整四算法\
    \ Williams blocks；\n   - shared 共 1,536 个 Unity processes 和 6,144 个 algorithm\
    \ samples；\n   - 21 个 heterogeneous scenarios；\n   - 每个 heterogeneous scenario\
    \ 48 个 matched superblocks；\n   - 每个 matched superblock 包含一个 fresh per-agent process\
    \ 和一个 fresh grouped-field process；\n   - heterogeneous 共 1,008 个 matched superblocks、2,016\
    \ 个 Unity processes和 4,032 个 algorithm samples；\n   - 总计 3,552 个 fresh Unity block\
    \ processes 和 10,176 个 algorithm samples。\n\n9. Unity measured execution 期间，任一\
    \ sample、block、matched superblock、correctness、oracle、structural exact-match、reset、telemetry、managed-memory、license、environment、hash、identity\
    \ 或原子持久化硬门禁失败时，继续执行原 formal fail-closed 规则：\n\n   - 不启动下一个 block；\n   - 原子保存 failure\
    \ checkpoint；\n   - 保存当前 global ordinal、campaign、block、superblock 和 run identity；\n\
    \   - 保存部分输出 manifest、日志、文件数量、原始字节数和最后写入时间；\n   - 标记：\n     `FAILED-NO-AUTO-RETRY-NO-RESUME-NO-TOP-UP-NO-MERGE`；\n\
    \   - 停止并向我报告；\n   - 不得自动开始新的 Unity attempt。\n\n10. 上述第 9 条只适用于尚未完成全部 Unity measured\
    \ execution 时发生的真实采集阶段失败。不得把所有 Unity blocks 完成之后发生的 raw-audit 或分析软件错误重新解释为 measured\
    \ acquisition 失败。\n\n三、Unity 执行完成后的 raw-commit 边界\n\n11. 当且仅当 3,552 个 Unity block\
    \ processes 均已完成且 10,176 个 algorithm samples 均已落盘后，编排器必须先原子写入中间状态：\n\n   `UNITY-COLLECTION-COMPLETE`\n\
    \   `RAW-COMMIT-AUDIT-PENDING`\n   `NO-UNITY-RERUN`\n\n12. 一旦进入该状态：\n\n   - 本次\
    \ attempt 的 Unity measured execution 永久结束；\n   - 不得因为后续 raw-commit auditor、manifest\
    \ generator、hash calculator、PowerShell、Python、JSON parser、统计分析器或报告生成器的软件缺陷而再次启动\
    \ Unity；\n   - 不得删除、覆盖或补齐已经采集的 measured block；\n   - 不得修改、重排或合并 raw observations；\n\
    \   - 不得从 schedule 起点或失败位置自动重新执行；\n   - 不得创建新的 measured sample 来替换已有 sample。\n\
    \n13. raw-commit audit 必须对已完成的 raw payload 进行只读验证，并生成至少：\n\n   - `raw-execution-manifest.json`；\n\
    \   - `raw-payload-file-manifest.jsonl`；\n   - `environment-end-snapshot.json`；\n\
    \   - `raw-data-freeze-receipt.json`；\n   - `formal-checkpoint.json`；\n   - block/sample\
    \ 完整性结果；\n   - 文件数量和原始字节数；\n   - 每个 block、sample、summary 和 workload result 的 SHA-256；\n\
    \   - schedule、Williams row、matched-superblock 和 AB/BA 配额检查；\n   - run ID 和 output\
    \ identity 唯一性检查；\n   - Unity process 与项目锁最终静止状态；\n   - canonical raw-payload\
    \ tree SHA-256。\n\n14. canonical raw-payload tree hash 必须使用确定性的、非自引用的文件清单计算。至少包括：\n\
    \n   - project-relative payload path；\n   - original byte count；\n   - file SHA-256；\n\
    \   - ordinal stable sort。\n\n   raw file manifest、freeze receipt、mutable root\
    \ status/checkpoint 和未来 analysis directories 不得作为其自身 payload hash 的成员。\n\n15.\
    \ raw-commit audit 全部通过后，必须：\n\n   - 对 schedule-owned measured payload 应用只读冻结；\n\
    \   - 冻结前后重新计算 canonical raw-payload tree SHA-256；\n   - 验证文件数量、原始字节数和 canonical\
    \ tree hash 均未变化；\n   - 验证冻结 payload 不包含可写 measured 文件；\n   - 生成并原子提交 `raw-data-freeze-receipt.json`；\n\
    \   - 将最终状态写为：\n\n     `RAW-DATA-COMPLETE`\n     `ANALYSIS-PENDING`\n     `IMMUTABLE`\n\
    \n16. `RAW-DATA-COMPLETE` 只能在 raw-commit audit 实际通过后声明。不得因为 Unity 已完成就跳过文件、身份、schedule、hash、telemetry\
    \ 或完整性核验。\n\n四、raw-commit auditor 故障的恢复规则\n\n17. 如果全部 Unity processes 已经完成，但 raw-commit\
    \ auditor 因普通软件问题失败，例如：\n\n   - PowerShell/Python/JSON parser 缺陷；\n   - manifest\
    \ 生成器 bug；\n   - 路径解析错误；\n   - 非自引用 hash 实现错误；\n   - report/serialization 错误；\n\
    \   - audit checkpoint 写入错误；\n   - 不影响 measured payload 本身的验证代码错误；\n\n   则状态必须保持为：\n\
    \n   `UNITY-COLLECTION-COMPLETE`\n   `RAW-COMMIT-AUDIT-PENDING`\n   `NO-UNITY-RERUN`\n\
