  user_words: "授权按顺序连续执行 Gate 10R、Gate 11R 和 Gate 12R。\n\n本消息是对 Gate 10R、Gate 11R、Gate\
    \ 12R 的一次性完整执行授权，不只是规划或审阅授权。请以以下文件所定义的当前活动路线为准：\n\n- Research/Gate10R_Onward_ProcessReuse_5pct_Experiment_Plan.md\n\
    - Research/Gate10R_5pct_Rebaseline_Decision.v1.json\n- Research/Gate10R_5pct_Rebaseline_Evidence_Audit.v1.json\n\
    - Research/Overall_Project_Plan.md\n- Research/Next_Session_Checkpoint.md\n\n\
    在没有发生硬门禁失败、不可恢复异常、需要改变冻结研究设计的实质性歧义，或超出本授权范围的不可逆操作时，不需要在 Gate 10R、Gate 11R、Gate\
    \ 12R 之间再次询问我。请连续、严格按 Gate 顺序工作，直到 Gate 12R 成功结束后再向我请求新的授权。\n\n一、共同执行原则\n\n1.\
    \ 当前正式活动设计为：\n\n   gate10r-onward-one-process-per-williams-block-5pct-playable-v1\n\
    \n2. Gate 13R 的进程模型必须建立在经过实际实现和测试的以下语义上：\n\n   - 每个完整 Williams block 启动一个全新的 Unity\
    \ Editor 进程；\n   - 四算法 block 在同一个新鲜进程内，按照冻结的 Williams 顺序分别执行 A*-R、D*L、C-FF、IDFF；\n\
    \   - 两算法 block 在同一个新鲜进程内，按照冻结顺序分别执行其获准的两个算法；\n   - 同一算法在一个 block 进程中最多执行一次；\n\
    \   - 一个 Unity Editor 进程最多执行一个 Williams block；\n   - 进程不得跨 scenario、cohort、campaign\
    \ 或 Williams block 复用；\n   - block 内样本视为配对且可能相关的数据；\n   - Williams block 进程才是独立\
    \ cluster；\n   - 不允许退回“每个样本一个 Unity 进程”或“一个 campaign 长期复用一个 Unity 进程”的设计。\n\n\
    3. 精度目标固定为相对 95% 置信区间半宽不超过 5%，使用：\n\n   ln(1.05) = 0.048790164169432\n\n   Gate\
    \ 12R 必须同时估计：\n\n   - 各算法边际 log-scale 变异；\n   - block 内配对 log-difference 变异；\n\
    \   - 同进程样本相关性；\n   - predecessor、position、carryover、process-age、JIT、GC、缓存和内存增长效应。\n\
    \n   样本量候选应使用预注册的保守方差上界计算，至少包括：\n\n   raw_n = ceil((1.96 × sigma_upper / ln(1.05))²)\n\
    \n   required_n = next_multiple_of_4(max(32, raw_n))\n\n   不得沿用旧 cold-process\
    \ pilot 或旧 Gate 12 的方差、相关性、n_formal 或 cap-148 结论。当前不预设新的硬 cap；Gate 12R 应报告未截断的候选\
    \ n_formal、资源需求和可行性。如果资源不可行，应在 Gate 12R 结束时把它列为需要我决定的 Gate 13R 前置事项，不得私自放宽 5%\
    \ 精度目标。\n\n4. 每个样本开始前必须重新创建，样本结束后必须清理：\n\n   - scenario definition 和 resolved\
    \ scenario；\n   - research grid；\n   - planner；\n   - experiment runner；\n   -\
    \ logger；\n   - metrics collector；\n   - output writer；\n   - manifest state；\n\
    \   - Unity 对象；\n   - 所有研究代码拥有的可变 static 状态。\n\n5. block 内任一样本失败时必须 fail closed：\n\
    \n   - 不得继续该 block 的后续样本；\n   - 不得自动 retry；\n   - 不得自动 resume；\n   - 必须原子保存失败\
    \ checkpoint、部分输出 manifest、日志、进程信息和已有输出的 SHA-256；\n   - 不得把不完整 block 纳入精度估计或正式样本量计算。\n\
    \n6. 使用版本化、原子写入和可审计 provenance。每个 Gate 的 specification、test design、config、manifest、checkpoint、receipt、日志和输出都必须带明确版本、设计\
    \ ID、输入哈希、生成时间、状态和允许的下游用途。\n\n7. 每完成一个 Gate，必须先完成该 Gate 的全部静态检查、单元测试、编译检查、正向测试、负向\
    \ fail-closed 测试、重复性验证、哈希审计和 validation-only 审计，确认硬门禁全部通过后，才能进入下一 Gate。\n\n8.\
    \ 对日常实现选择采用保守且可审计的方案并继续，不要因为常规检查点、已有授权范围内的文件创建、Unity 批处理启动或测试运行重复询问我。\n\n二、Gate\
    \ 10R 授权范围\n\n先冻结 Gate 10R 的正式 specification 和 test design，然后实现和验证“一 Williams\
    \ block 一新鲜 Unity Editor 进程”的执行机制。\n\nGate 10R 至少必须完成：\n\n1. 新的、版本化的 Gate 10R\
    \ process-reuse specification、test design、config、provenance、checkpoint 和验证 manifest。\n\
    \n2. 正向验证：\n\n   - 一个四算法 Williams block；\n   - 一个两算法 Williams block；\n   - 算法执行顺序与冻结\
    \ Williams 顺序完全一致；\n   - 每个算法在进程内最多出现一次；\n   - 每样本使用独立 run ID、输出目录、summary、manifest、完成标记和哈希；\n\
    \   - block 完成后 Unity 进程退出；\n   - 新 block 必须获得不同的新鲜 Unity 进程。\n\n3. 结构正确性验证：\n\
    \n   - 相同 scenario、algorithm 和 seed 的结构输出必须与新鲜 cold-process reference exact-match；\n\
    \   - 确定性重复运行必须 exact-match；\n   - timing 和进程级遥测字段可以按预注册规则排除在结构哈希之外，但排除字段必须事先明确列出。\n\
    \n4. reset 和泄漏验证：\n\n   - planner、grid、scenario、runner、logger、metrics、writer 和\
    \ static state 的重建与清理；\n   - 不允许上一 position 的可变状态泄漏到下一 position；\n   - 检查 managed\
    \ memory、working set、private memory、GC、JIT、process age 和缓存增长；\n   - native memory\
    \ 必须使用能够在 Unity batchmode 中返回正值、并可由独立 Windows OS 查询交叉核验的方法；\n   - managed memory\
    \ 的采样边界固定为样本返回、对象清理及预注册 full-GC 边界之后。\n\n5. 保持以下预注册上限，不得在观察结果后放宽：\n\n   - 单样本\
    \ retained managed growth ≤ 128 MiB；\n   - 完整 block retained managed growth ≤\
    \ 128 MiB；\n   - 完整 block working-set growth ≤ 512 MiB；\n   - 完整 block private-memory\
    \ growth ≤ 512 MiB。\n\n6. 负向测试至少覆盖：\n\n   - 中间 position 失败；\n   - 非法算法顺序；\n  \
    \ - 重复算法；\n   - 缺失输出；\n   - 哈希不匹配；\n   - 不完整 block；\n   - reset 失败；\n   - telemetry\
    \ 无效；\n   - checkpoint 原子性；\n   - 禁止后续样本继续运行；\n   - 禁止自动 retry/resume。\n\n7. 重新运行并通过适用于当前代码状态的\
    \ Gate 1–9 保留回归验证。\n\nGate 10R 全部门禁通过后，直接进入 Gate 11R，不需要再次询问我。\n\n三、Gate 11R 授权范围\n\
    \nGate 11R 必须重新冻结并生成与 5% process-reuse 活动设计绑定的新场景和配置 bundle，不得把旧 Gate 11 bundle\
    \ 直接当作新的活动输入。\n\n建议的新 bundle 根目录为：\n\nResearch/FormalScenarios/Gate11R_5pct/v1\n\
    \nGate 11R 至少必须完成：\n\n1. 重新冻结：\n\n   - shared-goal；\n   - per-agent heterogeneous-goal；\n\
    \   - grouped-field heterogeneous-goal；\n   - 正式场景矩阵；\n   - 参数水平；\n   - 确定性生成种子；\n\
    \   - canonical identity；\n   - 场景和算法 eligibility；\n   - 排除规则；\n   - cohort；\n\
    \   - Williams 顺序；\n   - 预注册分析表；\n   - scenario/campaign/algorithm-cell 映射。\n\n\
    2. 在当前计划未发现经审计的必要更改时，保持既定矩阵规模：\n\n   - 53 个唯一 canonical scenarios；\n   - 74 个\
    \ scenario/cohort campaign conditions；\n   - 212 个 eligible algorithm cells。\n\
    \n3. 新 Gate 11R bundle 必须有独立版本、独立哈希、独立 provenance 和独立验证报告。旧 Research/FormalScenarios/v1\
    \ 只能作为历史设计证据，不得成为 Gate 13R 的活动执行输入。\n\n4. 为每一个实验条件提供可在 Unity Editor 中进入 Play Mode\
    \ 的可视化入口。允许使用“场景模板＋campaign profile＋algorithm-cell preset”的规范化设计，不要求为每次重复物理复制一个\
    \ .unity 文件，但每个正式实验条件和算法 cell 都必须有唯一、确定、可审计的映射。\n\n5. Playable Unity Scenes 的最低交付要求：\n\
    \n   - 53/53 个 canonical scenario 对应可打开的 .unity 场景；\n   - 74/74 个 campaign launch\
    \ profiles；\n   - 212/212 个 algorithm-cell presets；\n   - 一个统一 launcher；\n   -\
    \ 每个正式 repeat 可以由 scene、profile、preset、block、position 和 run ID 唯一定位；\n   - 场景可在\
    \ Unity Editor 中 Play；\n   - 支持 play、pause、single step、next event、restart 和 deterministic\
    \ seek；\n   - 显示 canonical grid、障碍物、agents、goals、动态事件、规划路径、expanded/repaired state、integration\
    \ field 和 direction field；\n   - cell 方向箭头使用已经采用的默认 research-visual-direction-glyph-v1；\n\
    \   - HUD 必须显示 scenario ID、algorithm、seed、event/tick、block/position 和 replay 状态；\n\
    \   - 屏幕必须固定显示：\n     VISUALIZATION REPLAY — NOT A TIMING RUN\n   - Playable 场景不得进入\
    \ timing benchmark；\n   - Unity Editor Play Mode、Scene View、Game View、Gizmos、动画和\
    \ OBS 录制开销不得写入正式性能指标；\n   - 后续视频只能作为实验过程的可视化补充，不能取代 headless 正式数据。\n\n6. 对 53\
    \ 个场景、74 个 profiles 和 212 个 presets 完成：\n\n   - 文件存在性检查；\n   - Unity GUID 唯一性和稳定性检查；\n\
    \   - hash manifest；\n   - canonical identity 对照；\n   - seed 对照；\n   - scenario\
    \ semantic parity；\n   - profile/preset eligibility；\n   - 场景打开与组件完整性验证；\n   -\
    \ representative Play Mode smoke test；\n   - 可视化输出与 headless 结构结果的语义一致性检查。\n\n\
    Gate 11R 全部门禁通过后，直接进入 Gate 12R，不需要再次询问我。\n\n四、Gate 12R 授权范围\n\n先冻结 Gate 12R 的\
    \ pilot specification、test design、pilot plan、preflight、统计规则、资源预算规则和停止规则。只有全部非执行门禁通过后，才授权运行一次新的\
    \ fresh 非正式 pilot。\n\n建议 pilot 根目录为：\n\nResearch/PilotRuns/Gate12R_ProcessReuse_5pct/v1\n\
    \n该根及所有输出必须明确标记：\n\nNON-FORMAL\nEXCLUDED-FROM-FORMAL-ANALYSIS\nNOT-FOR-GATE14-INFERENCE\n\
    \nGate 12R 至少必须完成：\n\n1. preflight：\n\n   - Unity 版本和 executable hash；\n   - 项目路径和项目锁；\n\
    \   - Git/工作区状态；\n   - config/spec/test-design hash；\n   - Gate 10R implementation\
    \ hash；\n   - Gate 11R retained bundle hash；\n   - Windows 用户身份；\n   - PowerShell\
    \ 版本及原生 PSModulePath；\n   - CPU、RAM、操作系统和存储；\n   - 原始字节存储空间；\n   - 电源计划；\n   -\
    \ 环境和热状态；\n   - 无关 Unity 进程；\n   - 输出根不存在或符合 fresh-run 条件；\n   - provenance 和\
    \ checkpoint 写入能力。\n\n2. 在 preflight 和所有测试通过后，只运行一轮预注册的 fresh pilot，不得自动重试或继续失败的\
    \ pilot。\n\n3. 如果当前冻结计划未因事前审计发现必须修正的问题，则 pilot 使用以下规模：\n\n   - 6 个 shared-goal\
    \ anchor campaigns；\n   - 3 个 heterogeneous anchors，并分别运行 per-agent 和 grouped-field；\n\
    \   - 共 12 个 measured campaigns；\n   - 每个 measured campaign 运行 32 个 Williams blocks；\n\
    \   - 共 384 个 measured block processes；\n   - 共 1,152 个 measured workload samples；\n\
    \   - 另有 8 个明确排除的 warmup block processes，共 24 个 warmup samples；\n   - 36 个 fresh\
    \ cold-process structural-control processes；\n   - 1 个 telemetry probe process；\n\
    \   - 不含 prepilot fixtures 时，总计 429 个 Unity processes、1,212 个 workload samples。\n\
    \n4. pilot 必须评估并报告：\n\n   - 各算法 marginal log SD；\n   - 关键算法对 paired log-difference\
    \ SD；\n   - block 内相关性和 cluster effect；\n   - algorithm × position balance；\n\
    \   - predecessor/carryover effect；\n   - process-age effect；\n   - JIT 和 warmup\
    \ effect；\n   - GC 行为；\n   - managed/native memory growth；\n   - RSS、working set\
    \ 和 private memory；\n   - reset 完整性和 static-state leakage；\n   - throughput；\n\
    \   - 单 block、单 campaign 和预计正式 campaign 的时间；\n   - 原始字节和总存储需求；\n   - 5% 精度目标下的未截断候选\
    \ n_formal；\n   - 资源和时间可行性；\n   - 任何需要在 Gate 13R 前由我决定的事项。\n\n5. pilot 的统计计算必须把\
    \ Williams block 作为独立 cluster，并显式处理同一进程内样本相关性。不得把 block 内的算法样本错误地当成彼此独立。\n\n6.\
    \ 如果 Gate 12R pilot 成功，则生成：\n\n   - versioned pilot completion receipt；\n   -\
    \ 完整 output manifest；\n   - SHA-256 manifest；\n   - provenance；\n   - statistical\
    \ summary；\n   - candidate n_formal；\n   - resource projection；\n   - Gate 12R\
    \ readiness checkpoint；\n   - Gate 13R 前置决策清单。\n\n7. 如果 Gate 12R 任何硬门禁或 pilot\
    \ 运行失败：\n\n   - 保存原子 checkpoint、日志、进程树、部分输出 manifest、文件数量、原始字节数、最后写入时间和 SHA-256；\n\
    \   - 明确标记失败状态及失败阶段；\n   - 禁止自动 retry；\n   - 禁止自动 resume；\n   - 禁止根据失败的不完整 pilot\
    \ 生成可采纳的 n_formal；\n   - 停止并向我报告，不得继续 Gate 13R。\n\n五、必须保持不变的内容\n\n不得修改、覆盖、删除、继续、合并或重新解释以下历史证据：\n\
    \n- Research/FormalRuns/Gate13/v1\n- Research/PilotRuns/Gate13_ProcessReuse/v1\n\
    - Research/PilotRuns/Gate13_ProcessReuse/v2\n- 旧 cold-process attempt-1/attempt-2\
    \ receipt、日志、诊断和 checkpoint\n- cold-process user-termination/design-change receipt\n\
    - Research/Gate13_Execution_Authorization.v1.json\n- Research/Gate13_Execution_Authorization.v2.json\n\
    - Research/Gate13_Readiness_Amendment.v1.json\n- Research/Gate13_Formal_Campaign_Config.v1.json\n\
    - Research/PilotRuns/Gate12/v1\n- Gate 12 的两个失败尝试归档\n- Gate 11 旧 retained bundle\n\
    - 原始项目脚本\n- 原始 Unity 场景\n\n上述旧 Gate 10–13 结果仍是历史审计证据，但永久不得作为新的 Gate 13R 正式推断数据、正式样本量证据或\
    \ Gate 14R 正式分析输入。\n\n所有新增实现必须位于独立的 Research 命名空间、Editor 工具目录、研究场景目录或新的版本化输出根中。不得修改原始\
    \ gameplay 脚本和原始场景。\n\n六、本次明确不授权的内容\n\n本次授权不包括：\n\n- 创建 Gate 13R 正式输出根；\n- 创建\
    \ Gate 13R formal execution receipt；\n- 启动 Gate 13R 正式 timing campaign；\n- 启动\
    \ Gate 14R 正式分析；\n- 把任何 Gate 12R pilot 输出用于正式推断；\n- 自动 retry 或 resume 任一失败 Gate/pilot；\n\
    - 删除或覆盖任何历史运行证据；\n- 降低 5% 精度目标；\n- 观察 pilot 结果后事后放宽内存、正确性或一致性阈值。\n\n预留的正式输出根：\n\
    \nResearch/FormalRuns/Gate13R_ProcessReuse_5pct/v1\n\n在本次授权下不得创建。\n\n七、过程记录与最终停止点\n\
    \n1. 将本消息的原文作为用户授权写入活动 Material Passport/run ledger，并使用正式 ledger 工具记录文件哈希、Gate\
    \ 状态、工具回执和检查点。\n\n2. 每完成一个 Gate，更新：\n\n   - Research/Overall_Project_Plan.md\n\
    \   - Research/Next_Session_Checkpoint.md\n   - 对应 Gate specification/test design/checkpoint\n\
    \   - versioned manifest\n   - SHA-256 审计结果\n   - active lineage/provenance\n\n\
    3. Gate 10R 和 Gate 11R 通过后直接继续，不需要等待我的确认。\n\n4. Gate 12R 成功完成后必须停止，不得开始 Gate 13R。此时向我交付：\n\
    \n   - Gate 10R、Gate 11R、Gate 12R 的完成状态；\n   - 实际通过的测试和回归数量；\n   - Gate 11R Playable\
    \ Unity Scenes、profiles 和 presets 的数量及路径；\n   - Gate 12R pilot 的实际完成 block/process/sample\
    \ 数；\n   - 5% 精度对应的候选 n_formal；\n   - block 内相关性、carryover、position、JIT、GC 和内存结论；\n\
    \   - 正式运行预计时间和存储需求；\n   - 所有异常、排除项和残余风险；\n   - Gate 13R readiness 判定；\n   - 一份可直接复制发送的\
    \ Gate 13R 正式执行授权提示词。\n\n5. 如果 Gate 12R 成功但候选 n_formal 或资源需求需要我的选择，请在 Gate 13R\
    \ 授权提示词中列出明确的待选方案，不得替我作出会改变精度目标或正式研究规模的决定。\n\n现在请按照上述授权，从 Gate 10R 开始，连续工作到 Gate\
    \ 12R 的规定停止点。"
